# Configuracoes do Gradle para o projeto inteiro.
# No Android Studio, o que for configurado pela IDE tem prioridade sobre este arquivo.
# Mais detalhes: https://docs.gradle.org/current/userguide/build_environment.html

# Argumentos da JVM usados pelo daemon do Gradle. E aqui que se ajusta a memoria.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Com o cache de configuracao, o Gradle pula a fase de configuracao quando nada
# que a afeta mudou (os scripts de build, por exemplo).
org.gradle.configuration-cache=true

# Estilo de codigo Kotlin deste projeto: "official" ou "obsolete".
kotlin.code.style=official
